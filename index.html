<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICRULER - Minimalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #000000; 
            color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: -0.02em; 
            user-select: none;
        }

        /* Top Label */
        .top-label {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: none;
            z-index: 10;
        }

        /* Bottom Dock */
        .bottom-dock {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: transparent;
            padding: 0.8rem 1.8rem;
            z-index: 50;
            transition: opacity 0.2s;
            white-space: nowrap;
            max-width: 90vw;
            overflow-x: auto;
        }
        
        /* Hide scrollbar for dock */
        .bottom-dock::-webkit-scrollbar { display: none; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            position: relative;
        }

        label {
            font-size: 0.5rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 0.2rem;
        }

        select {
            appearance: none;
            background-color: transparent;
            border: none;
            color: #bbb;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding-right: 1.2rem;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 0.6em;
            transition: color 0.2s;
            min-width: 60px;
        }
        select:hover, select:focus { color: #fff; outline: none; }

        input[type="number"] {
            background: rgba(255,255,255,0.05);
            border: none;
            border-bottom: 1px solid #888;
            color: #fff;
            width: 50px;
            font-size: 0.8rem;
            text-align: right;
            outline: none;
            font-family: monospace;
            padding: 0 4px;
            border-radius: 2px;
        }
        input[type="number"]:focus { border-color: #0a84ff; background: rgba(255,255,255,0.1); }

        .toggle-btn {
            background: transparent;
            border: none;
            color: #bbb;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: color 0.2s;
            padding: 0;
            min-width: 40px;
        }
        .toggle-btn:hover { color: #fff; }

        .divider {
            width: 1px;
            height: 16px;
            background-color: rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        #canvas-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }

        canvas { display: block; }

        #tooltip {
            position: absolute;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1rem;
            border-left: 2px solid #fff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            font-size: 0.8rem;
            z-index: 20;
            min-width: 140px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .tooltip-val { font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; }
        .tooltip-row { display: flex; justify-content: space-between; margin-bottom: 0.3rem; color: #999; }

        .keyboard-hint {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 0.05em;
            pointer-events: none;
            display: flex;
            gap: 1rem;
            opacity: 0.7;
        }
        .key-tag {
            background: rgba(255,255,255,0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            color: #aaa;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="top-label">MICRULER</div>

    <div id="canvas-wrapper">
        <canvas id="rulerCanvas"></canvas>
        <div id="tooltip"></div>
    </div>
    
    <div class="keyboard-hint">
        <span><span class="key-tag">▲</span> <span class="key-tag">▼</span> Select Track</span>
        <span><span class="key-tag">◀</span> <span class="key-tag">▶</span> Move & Play</span>
    </div>

    <!-- Unified Bottom Dock -->
    <div class="bottom-dock">
        <!-- Hidden input for SCL file upload -->
        <input type="file" id="scl-file-input" accept=".scl" style="display: none;" onchange="handleSclUpload(event)">

        <div class="control-group">
            <label>Ref (Base)</label>
            <select id="ref-select" onchange="updateTunings('ref')"></select>
        </div>

        <div class="control-group">
            <label>Target</label>
            <select id="target-select" onchange="updateTunings('target')"></select>
        </div>
        
        <!-- Custom EDO Input -->
        <div class="control-group" id="edo-group" style="display:none;">
            <label>N (Steps)</label>
            <input type="number" id="edo-input" value="31" step="0.01" min="1" onchange="updateTunings()" onkeydown="if(event.key==='Enter') updateTunings()">
        </div>

        <div class="divider"></div>
        
        <!-- Playback Drone Toggle (NEW) -->
        <div class="control-group">
            <label>&nbsp;</label>
            <button class="toggle-btn" id="drone-btn" onclick="toggleDrone()">Drone: ON</button>
        </div>

        <div class="divider"></div>

        <!-- Ratio Format Toggle -->
        <div class="control-group">
            <label>&nbsp;</label>
            <button class="toggle-btn" id="fmt-btn" onclick="toggleRatioFormat()">Ratio</button>
        </div>
    </div>

    <script>
        const tunings = {
            "12-TET": [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200],
            "Just Intonation": [0, 111.73, 203.91, 315.64, 386.31, 498.04, 590.22, 701.96, 813.69, 884.36, 996.09, 1088.27, 1200],
            "Pythagorean": [0, 113.69, 203.91, 294.13, 407.82, 498.04, 611.73, 701.96, 792.18, 905.87, 996.09, 1109.78, 1223.46], 
            "Meantone 1/4": [0, 76.0, 193.2, 310.3, 386.3, 503.4, 579.5, 696.6, 772.6, 889.7, 1006.8, 1082.9, 1200],
            "Werckmeister III": [0, 90.22, 192.18, 294.13, 390.22, 498.04, 588.27, 696.09, 792.18, 888.27, 996.09, 1092.18, 1200],
            "Young No.2": [0, 94.14, 196.09, 298.05, 392.18, 501.96, 592.18, 700, 796.09, 894.14, 1000, 1094.14, 1200],
            "Harmonic Series (16-32)": [0, 104.96, 203.91, 297.51, 386.31, 470.78, 551.32, 628.27, 701.96, 772.63, 840.53, 905.87, 968.83, 1029.58, 1088.27, 1145.04, 1200]
        };

        const tuningFractions = {
            "Just Intonation": ["1:1", "16:15", "9:8", "6:5", "5:4", "4:3", "45:32", "3:2", "8:5", "5:3", "16:9", "15:8", "2:1"],
            "Pythagorean": ["1:1", "256:243", "9:8", "32:27", "81:64", "4:3", "729:512", "3:2", "128:81", "27:16", "16:9", "243:128", "531441:262144"],
            "Harmonic Series (16-32)": ["1:1", "17:16", "9:8", "19:16", "5:4", "21:16", "11:8", "23:16", "3:2", "25:16", "13:8", "27:16", "7:4", "29:16", "15:8", "31:16", "2:1"]
        };

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B", "C'"];
        
        let currentRef = tunings["12-TET"];
        let currentTarget = tunings["Pythagorean"];
        let displayMode = 'both'; 
        
        let activeTrack = 'target'; // 'ref' or 'target'
        let selectedRefIndex = 0;
        let selectedTargetIndex = 7;
        
        let showDecimalRatio = false; 
        let droneEnabled = true; // NEW: Toggle to play fundamental tone for harmonic comparison
        
        let customRefEDO = null; 
        let customTargetEDO = null;
        let activeSclTarget = null;
        let prevRefKey = "12-TET";
        let prevTargetKey = "Pythagorean";

        const canvas = document.getElementById('rulerCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        let width, height, cx, cy;
        
        let hoveredTrack = null;
        let hoveredIndex = -1; 
        let audioCtx;
        let currentOscs = []; // 新增：用于追踪当前播放的音频，实现干净的单音切换

        function init() {
            populateSelects();
            resize();
            window.addEventListener('resize', resize);
            
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseleave', () => {
                hoveredTrack = null;
                hoveredIndex = -1;
                tooltip.style.opacity = 0;
                draw();
            });
            canvas.addEventListener('mousedown', handleClick);
            
            canvas.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
                handleClick({ clientX: touch.clientX, clientY: touch.clientY });
            }, {passive: false});

            window.addEventListener('keydown', handleKeyDown);
        }

        // Stops all currently playing audio tones to prevent overlap during fast movements
        function stopAllOscs() {
            currentOscs.forEach(o => {
                try {
                    o.osc.stop();
                    o.osc.disconnect();
                    o.gain.disconnect();
                } catch(e) {}
            });
            currentOscs = [];
        }

        // Enhanced Playback: Uses Triangle waves and a Root Drone to expose tuning differences
        function playActiveTone() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            stopAllOscs();

            const baseFreq = 261.63; // C4
            
            let cents = activeTrack === 'ref' ? currentRef[selectedRefIndex] : currentTarget[selectedTargetIndex];
            let freq = baseFreq * Math.pow(2, cents / 1200);

            // Play the active selected note (Using Triangle for audible harmonics)
            playOsc(freq, 'triangle', 0, 1.5, 0.4); 

            // Play the drone (Base Frequency) to clearly expose microtonal interval beating
            // (We skip the drone if we are playing the unison or octave)
            if (droneEnabled && Math.abs(cents) > 1 && Math.abs(cents - 1200) > 1) {
                playOsc(baseFreq, 'triangle', 0, 1.5, 0.15); // Quieter drone
            }
        }

        function playOsc(freq, type, delay, duration, maxVol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            
            // Envelope shaping
            gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
            gain.gain.linearRampToValueAtTime(maxVol, audioCtx.currentTime + delay + 0.05); // Quick attack
            gain.gain.setTargetAtTime(0.001, audioCtx.currentTime + delay + 0.1, duration / 3); // Smooth natural decay

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + duration + 0.5);

            currentOscs.push({osc: osc, gain: gain});
        }

        function toggleDrone() {
            droneEnabled = !droneEnabled;
            document.getElementById('drone-btn').innerText = droneEnabled ? 'Drone: ON' : 'Drone: OFF';
            playActiveTone(); // Play immediately to demonstrate the new state
        }

        function handleKeyDown(e) {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;

            const isArrowKey = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key);
            if (isArrowKey) e.preventDefault();

            let changed = false;
            let play = false;

            if (e.key === 'ArrowUp') {
                if (activeTrack !== 'ref') {
                    activeTrack = 'ref';
                    const targetCents = currentTarget[selectedTargetIndex];
                    let minDiff = Infinity, bestIdx = 0;
                    currentRef.forEach((c, i) => {
                        if (Math.abs(c - targetCents) < minDiff) { minDiff = Math.abs(c - targetCents); bestIdx = i; }
                    });
                    selectedRefIndex = bestIdx;
                    changed = true; play = true;
                }
            } else if (e.key === 'ArrowDown') {
                if (activeTrack !== 'target') {
                    activeTrack = 'target';
                    const refCents = currentRef[selectedRefIndex];
                    let minDiff = Infinity, bestIdx = 0;
                    currentTarget.forEach((c, i) => {
                        if (Math.abs(c - refCents) < minDiff) { minDiff = Math.abs(c - refCents); bestIdx = i; }
                    });
                    selectedTargetIndex = bestIdx;
                    changed = true; play = true;
                }
            } else if (e.key === 'ArrowLeft') {
                if (activeTrack === 'ref' && selectedRefIndex > 0) {
                    selectedRefIndex--; changed = true; play = true;
                } else if (activeTrack === 'target' && selectedTargetIndex > 0) {
                    selectedTargetIndex--; changed = true; play = true;
                }
            } else if (e.key === 'ArrowRight') {
                if (activeTrack === 'ref' && selectedRefIndex < currentRef.length - 1) {
                    selectedRefIndex++; changed = true; play = true;
                } else if (activeTrack === 'target' && selectedTargetIndex < currentTarget.length - 1) {
                    selectedTargetIndex++; changed = true; play = true;
                }
            }

            if (changed) draw();
            if (play) playActiveTone();
        }

        function populateSelects() {
            const targetSel = document.getElementById('target-select');
            const refSel = document.getElementById('ref-select');
            
            Object.keys(tunings).forEach(key => {
                let opt = document.createElement('option');
                opt.value = key;
                opt.text = key;
                targetSel.add(opt.cloneNode(true));
                refSel.add(opt);
            });
            
            let customOpt = document.createElement('option');
            customOpt.value = "Custom EDO";
            customOpt.text = "Custom EDO...";
            targetSel.add(customOpt.cloneNode(true));
            refSel.add(customOpt);

            let sclOpt = document.createElement('option');
            sclOpt.value = "Load SCL";
            sclOpt.text = "Load .scl File...";
            targetSel.add(sclOpt.cloneNode(true));
            refSel.add(sclOpt);
            
            refSel.value = "12-TET";
            targetSel.value = "Pythagorean";
            prevRefKey = "12-TET";
            prevTargetKey = "Pythagorean";
            
            currentRef = tunings["12-TET"];
            currentTarget = tunings["Pythagorean"];
        }
        
        function generateEDO(n) {
            const stepSize = 1200 / n;
            const centsArray = [];
            const maxPoints = Math.min(n, 500); 
            for(let i=0; i<=maxPoints; i++) {
                centsArray.push(i * stepSize);
            }
            return { n: n, array: centsArray };
        }

        function updateTunings(triggerSource) {
            const refSel = document.getElementById('ref-select');
            const targetSel = document.getElementById('target-select');
            let refKey = refSel.value;
            let targetKey = targetSel.value;

            if (triggerSource === 'ref' && refKey === "Load SCL") {
                activeSclTarget = 'ref';
                document.getElementById('scl-file-input').click();
                refSel.value = prevRefKey; 
                return;
            }
            if (triggerSource === 'target' && targetKey === "Load SCL") {
                activeSclTarget = 'target';
                document.getElementById('scl-file-input').click();
                targetSel.value = prevTargetKey; 
                return;
            }

            prevRefKey = refKey;
            prevTargetKey = targetKey;

            const edoInputGroup = document.getElementById('edo-group');
            const customN = parseFloat(document.getElementById('edo-input').value) || 31;

            if (refKey === "Custom EDO" || targetKey === "Custom EDO") {
                edoInputGroup.style.display = 'flex';
            } else {
                edoInputGroup.style.display = 'none';
            }

            if (refKey === "Custom EDO") {
                customRefEDO = generateEDO(customN);
                currentRef = customRefEDO.array;
            } else {
                currentRef = tunings[refKey];
                customRefEDO = null;
            }

            if (targetKey === "Custom EDO") {
                customTargetEDO = generateEDO(customN);
                currentTarget = customTargetEDO.array;
            } else {
                currentTarget = tunings[targetKey];
                customTargetEDO = null;
            }
            
            selectedRefIndex = Math.min(selectedRefIndex, currentRef.length - 1);
            selectedTargetIndex = Math.min(selectedTargetIndex, currentTarget.length - 1);
            draw();
        }

        function parseSCL(text) {
            const lines = text.split('\n').map(l => l.trim());
            const dataLines = lines.filter(l => l.length > 0 && !l.startsWith('!'));
            if(dataLines.length < 2) throw new Error("Invalid SCL");
            
            let description = dataLines[0];
            const numNotes = parseInt(dataLines[1]);
            const centsArray = [0]; 

            for(let i = 0; i < numNotes; i++) {
                const val = dataLines[2 + i];
                if(!val) continue; 
                const token = val.split(/\s+/)[0]; 
                if(token.includes('.')) {
                    centsArray.push(parseFloat(token));
                } else {
                    let n, d;
                    if(token.includes('/')) {
                        const parts = token.split('/');
                        n = parseInt(parts[0]);
                        d = parseInt(parts[1]);
                    } else {
                        n = parseInt(token);
                        d = 1;
                    }
                    centsArray.push(1200 * Math.log2(n/d));
                }
            }
            if (description.length > 20) description = description.substring(0, 20) + '...';
            return { name: description, array: centsArray };
        }

        function handleSclUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = parseSCL(evt.target.result);
                    let name = parsed.name || file.name.replace('.scl', '');
                    
                    let counter = 1;
                    let uniqueName = name;
                    while(tunings[uniqueName]) {
                        uniqueName = `${name} (${counter})`;
                        counter++;
                    }
                    tunings[uniqueName] = parsed.array;

                    const refSel = document.getElementById('ref-select');
                    const targetSel = document.getElementById('target-select');
                    
                    const opt1 = document.createElement('option');
                    opt1.value = uniqueName; opt1.text = uniqueName;
                    const opt2 = document.createElement('option');
                    opt2.value = uniqueName; opt2.text = uniqueName;

                    refSel.insertBefore(opt1, refSel.options[refSel.options.length-2]);
                    targetSel.insertBefore(opt2, targetSel.options[targetSel.options.length-2]);

                    if (activeSclTarget === 'ref') {
                        refSel.value = uniqueName;
                        prevRefKey = uniqueName;
                    } else if (activeSclTarget === 'target') {
                        targetSel.value = uniqueName;
                        prevTargetKey = uniqueName;
                    }
                    updateTunings(); 
                } catch (err) {
                    alert("Invalid or unsupported .scl file format.");
                    console.error(err);
                } finally {
                    e.target.value = ''; 
                }
            };
            reader.readAsText(file);
        }
        
        function toggleRatioFormat() {
            showDecimalRatio = !showDecimalRatio;
            document.getElementById('fmt-btn').innerText = showDecimalRatio ? 'Decimal' : 'Ratio';
            draw();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = document.getElementById('canvas-wrapper').clientHeight;
            cx = width / 2;
            cy = height / 2;
            draw();
        }

        function gcd(a, b) { return !b ? a : gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }
        
        function getRationalApproximation(decimal, limit = 5000) {
            let n1 = 1, d1 = 0, n2 = 0, d2 = 1, x = decimal;
            while(true) {
                let a = Math.floor(x);
                let n = a * n1 + n2, d = a * d1 + d2;
                if (d > limit) return { n: n1, d: d1 };
                n2 = n1; d2 = d1; n1 = n; d1 = d;
                if (Math.abs(x - a) < 1e-9) return { n: n, d: d };
                x = 1 / (x - a);
            }
        }

        function getErrorColor(diff) {
            const absDiff = Math.abs(diff);
            if (absDiff < 0.01) return '#32d74b'; 
            let alpha = 0.2 + (absDiff / 24) * 0.8; 
            if (alpha > 1) alpha = 1;
            if (diff > 0) return `rgba(255, 69, 58, ${alpha})`; 
            return `rgba(10, 132, 255, ${alpha})`; 
        }
        
        function getTextColor(diff) {
            if (Math.abs(diff) < 0.01) return '#32d74b'; 
            return diff > 0 ? '#ff453a' : '#0a84ff';
        }

        function getRatioText(cents, index, targetKey) {
            if (showDecimalRatio) {
                 const decimalRatio = Math.pow(2, cents / 1200);
                 return decimalRatio.toFixed(4);
            }

            if (targetKey === "Custom EDO" && customTargetEDO) {
                return `Step ${index}/${customTargetEDO.n}`;
            }
            
            if (tuningFractions[targetKey] && tuningFractions[targetKey][index]) {
                return tuningFractions[targetKey][index].replace(':', '/');
            }
            
            const decimalRatio = Math.pow(2, cents / 1200);
            const rational = getRationalApproximation(decimalRatio, 5000);
            return `${rational.n}/${rational.d}`;
        }
        
        function getLabelName(index, totalLength) {
            if (totalLength > 13) return `${index}`; 
            return noteNames[index] || index;
        }
        
        function getNearestRefCents(targetCents) {
            let nearest = currentRef[0];
            let minDiff = Math.abs(targetCents - nearest);
            for(let i=1; i<currentRef.length; i++) {
                const diff = Math.abs(targetCents - currentRef[i]);
                if (diff < minDiff) {
                    minDiff = diff;
                    nearest = currentRef[i];
                }
            }
            return nearest;
        }

        function getCoincidenceIndex(cents, index, targetKey) {
            let rational = null;
            if (targetKey !== "Custom EDO" && tuningFractions[targetKey] && tuningFractions[targetKey][index]) {
                const fracStr = tuningFractions[targetKey][index];
                if (fracStr.includes(':')) {
                    const parts = fracStr.split(':');
                    const n = parseInt(parts[0]);
                    const d = parseInt(parts[1]);
                    if (!isNaN(n) && !isNaN(d)) rational = { n: n, d: d };
                }
            }
            if (!rational) {
                const decimalRatio = Math.pow(2, cents/1200);
                rational = getRationalApproximation(decimalRatio, 5000);
            }
            if (rational.n > 10000 || rational.d > 10000) return ">10k";
            return lcm(rational.n, rational.d);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawAnalyzer();
        }

        function drawAnalyzer() {
            const rulerH = 80;
            const rulerY = (height * 0.35) - (rulerH / 2); 
            
            const gap = 100; 
            
            const graphY = rulerY + rulerH + gap;
            const bottomMargin = 100; 
            const graphH = height - bottomMargin - graphY;
            
            drawAnalyzerRuler(0, rulerY, width, rulerH);

            const activeKey = activeTrack === 'ref' ? document.getElementById('ref-select').value : document.getElementById('target-select').value;
            const cents = activeTrack === 'ref' ? currentRef[selectedRefIndex] : currentTarget[selectedTargetIndex];
            const decimalRatio = Math.pow(2, cents/1200);
            
            let rational = null;
            if (activeKey !== "Custom EDO" && tuningFractions[activeKey] && tuningFractions[activeKey][activeTrack === 'ref' ? selectedRefIndex : selectedTargetIndex]) {
                const fracStr = tuningFractions[activeKey][activeTrack === 'ref' ? selectedRefIndex : selectedTargetIndex];
                if (fracStr.includes(':')) {
                    const parts = fracStr.split(':');
                    const n = parseInt(parts[0]);
                    const d = parseInt(parts[1]);
                    if (!isNaN(n) && !isNaN(d)) rational = { n: n, d: d };
                }
            }
            
            if (!rational) {
                rational = getRationalApproximation(decimalRatio, 5000);
            }

            drawModule_Combined(0, graphY, width, graphH, rational, decimalRatio);
        }

        function drawAnalyzerRuler(x, y, w, h) {
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y - 120, w, h + 250); 
            ctx.clip();
            
            const axisY = y + h/2; 
            const maxCentsTarget = Math.max(1200, ...currentTarget);
            const maxCentsRef = Math.max(1200, ...currentRef);
            const maxCents = Math.max(maxCentsTarget, maxCentsRef);
            const scaleW = w * 0.9; 
            const padL = (w - scaleW)/2;
            const centsToX = (c) => padL + (c / maxCents) * scaleW;

            const refKey = document.getElementById('ref-select').value;

            ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, axisY); ctx.lineTo(padL + scaleW, axisY); ctx.stroke();

            currentRef.forEach((cents, i) => {
                const px = centsToX(cents);
                const isSelected = (activeTrack === 'ref' && selectedRefIndex === i);
                const isHovered = (hoveredTrack === 'ref' && hoveredIndex === i);
                
                if (isSelected) {
                    ctx.fillStyle = '#fff'; ctx.fillRect(px-1.5, axisY-20, 3, 20);
                } else if (isHovered) {
                    ctx.fillStyle = '#aaa'; ctx.fillRect(px-1, axisY-16, 2, 16);
                } else {
                    ctx.fillStyle = '#888'; ctx.fillRect(px-0.5, axisY-12, 1, 8);
                }

                ctx.fillStyle = (isSelected || isHovered) ? '#fff' : '#bbb'; 
                ctx.font = (isSelected || isHovered) ? 'bold 10px -apple-system' : '10px -apple-system'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                if (currentRef.length <= 20 || i%5===0 || i===currentRef.length-1 || isSelected || isHovered) {
                    ctx.fillText(getLabelName(i, currentRef.length), px, axisY - (isSelected ? 24 : 20));
                }

                if (isSelected || isHovered) {
                    drawLabelUp(px, axisY - 40, cents, i, refKey, isSelected || isHovered);
                }
            });

            const targetKey = document.getElementById('target-select').value;
            const isDense = currentTarget.length > 20;

            currentTarget.forEach((cents, i) => {
                const px = centsToX(cents);
                let diff;
                if (currentTarget.length === currentRef.length) diff = cents - currentRef[i];
                else diff = cents - getNearestRefCents(cents);

                const color = getErrorColor(diff);
                const isSelected = (activeTrack === 'target' && selectedTargetIndex === i);
                const isHovered = (hoveredTrack === 'target' && hoveredIndex === i);
                
                if (isSelected) {
                    ctx.fillStyle = '#fff'; ctx.fillRect(px-1.5, axisY, 3, 20);
                } else if (isHovered) {
                    ctx.fillStyle = color; ctx.fillRect(px-1, axisY, 2, 16); 
                } else {
                    ctx.fillStyle = color; ctx.fillRect(px-0.5, axisY, 1, 10); 
                }

                if (isSelected || isHovered || (!isDense && (Math.abs(diff) > 2 || displayMode !== 'cents'))) {
                     const txtColor = getTextColor(diff);
                     drawLabel(px, axisY + 30, diff, cents, i, targetKey, txtColor, isSelected || isHovered);
                }
            });
            ctx.restore();
        }

        function drawModule_Combined(x, y, w, h, rational, decimalRatio) {
            const pad = 40; const chartW = w - pad*2;
            const cx = x + pad; const cy = y + 20; 
            
            const m = rational.n;
            const textY = y + h - 10; 

            ctx.textAlign = 'left';
            ctx.fillStyle = '#888'; ctx.font = '10px -apple-system';
            ctx.fillText("HARMONIC LOCK", cx, textY - 25);
            
            let lockColor = (m <= 24) ? '#32d74b' : '#ff453a';
            ctx.fillStyle = lockColor; ctx.font = '24px -apple-system';
            ctx.fillText(`#${m}`, cx, textY);
        }

        function drawLabel(x, y, diff, cents, index, targetKey, color, isHovered) {
            ctx.textAlign = 'center'; ctx.textBaseline = 'top'; 
            
            const diffLabel = (diff > 0 ? '+' : '') + diff.toFixed(1);
            const absLabel = cents.toFixed(1);
            const ratioLabel = getRatioText(cents, index, targetKey);
            const ci = getCoincidenceIndex(cents, index, targetKey);
            
            ctx.font = isHovered ? 'bold 12px -apple-system' : '500 11px -apple-system';
            ctx.fillStyle = '#fff';
            ctx.fillText(ratioLabel, x, y);
            
            ctx.font = '10px -apple-system'; 
            ctx.fillStyle = color;
            ctx.fillText(diffLabel, x, y + 14);

            ctx.fillStyle = '#ddd'; 
            ctx.fillText(absLabel, x, y + 26);
            
            ctx.fillStyle = '#999'; ctx.font = '9px -apple-system';
            ctx.fillText(`C.I. ${ci}`, x, y + 38);
        }

        function drawLabelUp(x, y, cents, index, key, isHovered) {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; 
            
            const absLabel = cents.toFixed(1);
            const ratioLabel = getRatioText(cents, index, key);
            const ci = getCoincidenceIndex(cents, index, key);
            
            ctx.font = isHovered ? 'bold 12px -apple-system' : '500 11px -apple-system';
            ctx.fillStyle = '#fff';
            ctx.fillText(ratioLabel, x, y);
            
            ctx.font = '10px -apple-system'; 
            ctx.fillStyle = '#ddd';
            ctx.fillText(absLabel, x, y - 14);
            
            ctx.fillStyle = '#999'; ctx.font = '9px -apple-system';
            ctx.fillText(`C.I. ${ci}`, x, y - 26);
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (mouseY > height - 80) return;

            const rulerH = 80;
            const rulerY = (height * 0.35) - (rulerH / 2); 
            const axisY = rulerY + rulerH/2;
            
            if (mouseY > rulerY - 40 && mouseY < rulerY + rulerH + 60) {
                const maxCentsTarget = Math.max(1200, ...currentTarget);
                const maxCentsRef = Math.max(1200, ...currentRef);
                const maxCents = Math.max(maxCentsTarget, maxCentsRef);
                
                const scaleW = width * 0.9;
                const padL = (width - scaleW)/2;
                let minDist = 20;
                let foundIndex = -1;
                let foundTrack = null;

                if (mouseY < axisY) {
                    currentRef.forEach((cents, i) => {
                        const x = padL + (cents/maxCents) * scaleW;
                        if (Math.abs(mouseX - x) < minDist) { minDist = Math.abs(mouseX - x); foundIndex = i; foundTrack = 'ref'; }
                    });
                } else {
                    currentTarget.forEach((cents, i) => {
                        const x = padL + (cents/maxCents) * scaleW;
                        if (Math.abs(mouseX - x) < minDist) { minDist = Math.abs(mouseX - x); foundIndex = i; foundTrack = 'target'; }
                    });
                }
                
                if (foundIndex !== hoveredIndex || foundTrack !== hoveredTrack) { 
                    hoveredIndex = foundIndex; 
                    hoveredTrack = foundTrack;
                    
                    // 光标悬停时直接更新激活轨道并严格只播放该音高
                    if (hoveredIndex !== -1 && hoveredTrack !== null) {
                        activeTrack = hoveredTrack;
                        if (activeTrack === 'ref') {
                            selectedRefIndex = hoveredIndex;
                        } else {
                            selectedTargetIndex = hoveredIndex;
                        }
                        // 需要用户进行过至少一次点击交互（解锁音频上下文）后，才能在 hover 时触发播放
                        if (audioCtx && audioCtx.state === 'running') {
                            playActiveTone();
                        }
                    }
                    draw(); 
                }
                tooltip.style.opacity = 0;
                return;
            } else {
                if (hoveredIndex !== -1) {
                    hoveredIndex = -1;
                    hoveredTrack = null;
                    draw();
                }
            }
        }

        function handleClick(e) {
            if (hoveredIndex === -1 || hoveredTrack === null) return;
            activeTrack = hoveredTrack;
            if (activeTrack === 'ref') {
                selectedRefIndex = hoveredIndex;
            } else {
                selectedTargetIndex = hoveredIndex;
            }
            draw();
            playActiveTone();
        }
        
        function stopAllOscs() {
            currentOscs.forEach(o => {
                try {
                    o.osc.stop();
                    o.osc.disconnect();
                    o.gain.disconnect();
                } catch(err) {}
            });
            currentOscs = [];
        }

        function playActiveTone() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            stopAllOscs(); // 每次播放新音高前，立刻停止旧的声音，避免重叠造成听觉混淆
            
            const baseFreq = 261.63; // C4
            
            // 严格确保只计算和播放当前激活轨道所对应的音高
            let freq;
            if (activeTrack === 'ref') {
                freq = baseFreq * Math.pow(2, currentRef[selectedRefIndex] / 1200);
            } else {
                freq = baseFreq * Math.pow(2, currentTarget[selectedTargetIndex] / 1200);
            }

            // 使用 'triangle' (三角波) 替代 'sine'。
            // 纯正弦波缺乏泛音，人耳极难分辨微小音分差异。三角波丰富的泛音能让你清晰听到上下刻度切换时的音准变化。
            playOsc(freq, 'triangle', 0, 1.0); 
        }

        function playOsc(freq, type, delay, duration) {
            const osc = audioCtx.createOscillator(); 
            const gain = audioCtx.createGain();
            
            osc.type = type; 
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
            gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + delay + 0.05); // 稍微提高一点听觉增益
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + delay); 
            
            currentOscs.push({osc: osc, gain: gain});
            
            // 定时清理播放完的振荡器
            setTimeout(() => {
                const index = currentOscs.findIndex(o => o.osc === osc);
                if (index > -1) currentOscs.splice(index, 1);
            }, (duration + 0.1) * 1000);
        }

        init();
    </script>
