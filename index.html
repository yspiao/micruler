<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICRULER - Minimalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Global Minimalist Black */
        body { 
            background-color: #000000; 
            color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: -0.02em; 
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Label */
        .top-label {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: none;
            z-index: 10;
        }

        /* Bottom Dock */
        .bottom-dock {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(10, 10, 10, 0.8); 
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.8rem; 
            z-index: 50; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap; 
            max-width: 90vw; 
            overflow-x: auto;
        }
        .bottom-dock::-webkit-scrollbar { display: none; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            position: relative;
        }

        label {
            font-size: 0.5rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 0.2rem;
        }

        /* Select */
        select {
            appearance: none;
            background-color: transparent;
            border: none;
            color: #bbb;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding-right: 1.2rem;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 0.6em;
            transition: color 0.2s;
            min-width: 60px;
        }
        select:hover, select:focus { color: #fff; outline: none; }

        /* Input */
        input[type="number"] {
            background: rgba(255,255,255,0.05);
            border: none;
            border-bottom: 1px solid #888;
            color: #fff;
            width: 50px;
            font-size: 0.8rem;
            text-align: right;
            outline: none;
            font-family: monospace;
            padding: 0 4px;
            border-radius: 2px;
        }
        input[type="number"]:focus { border-color: #0a84ff; background: rgba(255,255,255,0.1); }

        /* Button Toggle */
        .toggle-btn {
            background: transparent;
            border: none;
            color: #bbb;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: color 0.2s;
            padding: 0;
            min-width: 40px;
        }
        .toggle-btn:hover { color: #fff; }

        /* Divider */
        .divider {
            width: 1px;
            height: 16px;
            background-color: rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        #canvas-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Keyboard hint styles */
        .keyboard-hint {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 0.05em;
            pointer-events: none;
            display: flex;
            gap: 1rem;
            opacity: 0.7;
        }
        .key-tag {
            background: rgba(255,255,255,0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            color: #aaa;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="top-label">MICRULER</div>

    <div class="keyboard-hint">
        <span><span class="key-tag">▲</span> <span class="key-tag">▼</span> Track</span>
        <span><span class="key-tag">◀</span> <span class="key-tag">▶</span> Move</span>
    </div>

    <div id="canvas-wrapper">
        <canvas id="rulerCanvas"></canvas>
    </div>
    
    <div class="bottom-dock">
        <input type="file" id="scl-file-input" accept=".scl" style="display: none;" onchange="handleSclUpload(event)">

        <div class="control-group">
            <label>Ref (Top)</label>
            <select id="ref-select" onchange="updateTunings('ref')"></select>
        </div>

        <div class="control-group">
            <label>Target (Bottom)</label>
            <select id="target-select" onchange="updateTunings('target')"></select>
        </div>
        
        <div class="control-group" id="edo-group" style="display:none;">
            <label>N (Steps)</label>
            <input type="number" id="edo-input" value="31" step="0.01" min="1" onchange="updateTunings()" onkeydown="if(event.key==='Enter') updateTunings()">
        </div>

        <div class="control-group" id="ji-group" style="display:none;">
            <label>JI Limit</label>
            <select id="ji-limit" onchange="updateTunings()">
                <option value="3">3-Limit</option>
                <option value="5" selected>5-Limit</option>
                <option value="7">7-Limit</option>
                <option value="11">11-Limit</option>
            </select>
        </div>

        <div class="divider"></div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button class="toggle-btn" id="fmt-btn" onclick="toggleRatioFormat()">Ratio</button>
        </div>
    </div>

    <script>
        // --- Core Tuning Data ---
        const standardTunings = {
            "12-TET": [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200],
            "Just Intonation": [0, 111.73, 203.91, 315.64, 386.31, 498.04, 590.22, 701.96, 813.69, 884.36, 996.09, 1088.27, 1200],
            "Pythagorean": [0, 113.69, 203.91, 294.13, 407.82, 498.04, 611.73, 701.96, 792.18, 905.87, 996.09, 1109.78, 1223.46], 
            "Meantone 1/4": [0, 76.0, 193.2, 310.3, 386.3, 503.4, 579.5, 696.6, 772.6, 889.7, 1006.8, 1082.9, 1200],
            "Harmonic Series": [0, 104.96, 203.91, 297.51, 386.31, 470.78, 551.32, 628.27, 701.96, 772.63, 840.53, 905.87, 968.83, 1029.58, 1088.27, 1145.04, 1200]
        };

        const tuningFractions = {
            "Just Intonation": ["1/1", "16/15", "9/8", "6/5", "5/4", "4/3", "45/32", "3/2", "8/5", "5/3", "16/9", "15/8", "2/1"],
            "Pythagorean": ["1/1", "256/243", "9/8", "32/27", "81/64", "4/3", "729/512", "3/2", "128/81", "27/16", "16/9", "243/128", "2/1"],
            "Harmonic Series": ["1/1", "17/16", "9/8", "19/16", "5/4", "21/16", "11/8", "23/16", "3/2", "25/16", "13/8", "27/16", "7/4", "29/16", "15/8", "31/16", "2/1"]
        };

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B", "C'"];
        
        let tunings = { ...standardTunings };
        let currentRef = tunings["12-TET"];
        let currentTarget = tunings["Pythagorean"];
        
        // Custom JI Generator Database (Primes up to 11)
        const jiPool = [
            {n:1, d:1}, {n:256, d:243}, {n:16, d:15}, {n:10, d:9}, {n:9, d:8}, {n:8, d:7}, {n:7, d:6},
            {n:32, d:27}, {n:6, d:5}, {n:5, d:4}, {n:81, d:64}, {n:9, d:7}, {n:21, d:16}, {n:4, d:3},
            {n:11, d:8}, {n:7, d:5}, {n:45, d:32}, {n:64, d:45}, {n:10, d:7}, {n:16, d:11}, {n:3, d:2},
            {n:32, d:21}, {n:14, d:9}, {n:128, d:81}, {n:8, d:5}, {n:5, d:3}, {n:27, d:16}, {n:12, d:7},
            {n:7, d:4}, {n:16, d:9}, {n:9, d:5}, {n:15, d:8}, {n:243, d:128}, {n:2, d:1}
        ];

        let refRatios = [];
        let targetRatios = [];
        let customRefEDO = null; 
        let customTargetEDO = null;

        // Interaction State
        let activeTrack = 'target'; 
        let selectedRefIndex = 0;
        let selectedTargetIndex = 7;
        let anchorCents = 700; // 新增：记录用户明确选择的意图音分，解决上下切换时吸附不对齐的问题
        
        let showDecimalRatio = false; 
        let audioCtx;
        let currentOscs = []; // Global tracking to prevent clipping

        const canvas = document.getElementById('rulerCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function init() {
            populateSelects();
            resize();
            window.addEventListener('resize', resize);
            
            // Interaction Hooks
            canvas.addEventListener('mousedown', handleClick);
            window.addEventListener('keydown', handleKeyDown);
            
            // Start Global Render Loop (Drives the beating animation)
            requestAnimationFrame(renderLoop);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = document.getElementById('canvas-wrapper').clientHeight;
        }

        function playTone() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const baseFreq = 261.63; // C4
            const cents = activeTrack === 'ref' ? currentRef[selectedRefIndex] : currentTarget[selectedTargetIndex];
            const freq = baseFreq * Math.pow(2, cents / 1200);

            const now = audioCtx.currentTime;
            
            // Immediately stop previous oscillators to prevent clicking/clipping
            currentOscs.forEach(o => {
                try {
                    o.gain.gain.cancelScheduledValues(now);
                    o.gain.gain.linearRampToValueAtTime(0, now + 0.015);
                    o.osc.stop(now + 0.03);
                } catch(err) {}
            });
            currentOscs = [];

            // 1. 创建合成器与音量控制，新增滤波器(Filter)以提升质感
            const osc = audioCtx.createOscillator(); 
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            // 2. 核心改动：使用锯齿波(sawtooth)。它拥有最完整的奇偶泛音列，能让人耳极其敏锐地捕捉微音分差异。
            osc.type = 'sawtooth'; 
            osc.frequency.value = freq;
            
            // 加入低通滤波，削掉过于尖锐的高频，让声音温润（模拟模拟合成器的质感）
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2500, now);
            
            // 3. 核心改动：延长 Sustain 包络
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.02); // 柔和的起音 Attack
            // 衰减时间从 0.3s 延长到了 0.7s (多出了 0.4s 的 Sustain 延音)
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7); 
            
            osc.connect(filter); 
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now); 
            osc.stop(now + 0.8); // 配合延音，将强制切断时间也延后
            
            currentOscs.push({osc, gain});
        }

        function handleKeyDown(e) {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
            const isArrowKey = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key);
            if (isArrowKey) e.preventDefault();

            let play = false;

            if (e.key === 'ArrowUp') {
                activeTrack = 'ref';
                selectedRefIndex = getNearestIndex(currentRef, anchorCents); // 使用意图锚点垂直对齐
                play = true;
            } else if (e.key === 'ArrowDown') {
                activeTrack = 'target';
                selectedTargetIndex = getNearestIndex(currentTarget, anchorCents); // 使用意图锚点垂直对齐
                play = true;
            } else if (e.key === 'ArrowLeft') {
                if (activeTrack === 'ref' && selectedRefIndex > 0) { 
                    selectedRefIndex--; 
                    anchorCents = currentRef[selectedRefIndex]; // 更新横向意图
                    play = true; 
                } else if (activeTrack === 'target' && selectedTargetIndex > 0) { 
                    selectedTargetIndex--; 
                    anchorCents = currentTarget[selectedTargetIndex]; // 更新横向意图
                    play = true; 
                }
            } else if (e.key === 'ArrowRight') {
                if (activeTrack === 'ref' && selectedRefIndex < currentRef.length - 1) { 
                    selectedRefIndex++; 
                    anchorCents = currentRef[selectedRefIndex]; // 更新横向意图
                    play = true; 
                } else if (activeTrack === 'target' && selectedTargetIndex < currentTarget.length - 1) { 
                    selectedTargetIndex++; 
                    anchorCents = currentTarget[selectedTargetIndex]; // 更新横向意图
                    play = true; 
                }
            }
            if (play) playTone();
        }

        function handleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            const mouseX = e.clientX - rect.left;
            
            // Calculate Ruler Bounds
            const rulerH = 80;
            const rulerY = (height * 0.5) - (rulerH / 2);
            const axisY = rulerY + rulerH/2;

            const scaleW = width * 0.9; 
            const padL = (width - scaleW)/2;
            const maxCents = Math.max(Math.max(...currentRef), Math.max(...currentTarget));
            const clickedCents = ((mouseX - padL) / scaleW) * maxCents;

            // Global Click Hit Test (Upper half = Ref, Lower half = Target)
            if (mouseY < axisY) {
                activeTrack = 'ref';
                selectedRefIndex = getNearestIndex(currentRef, clickedCents);
                anchorCents = currentRef[selectedRefIndex]; // 更新横向意图
            } else {
                activeTrack = 'target';
                selectedTargetIndex = getNearestIndex(currentTarget, clickedCents);
                anchorCents = currentTarget[selectedTargetIndex]; // 更新横向意图
            }
            playTone();
        }

        function getNearestIndex(arr, targetVal) {
            let minDiff = Infinity, bestIdx = 0;
            arr.forEach((val, i) => {
                if (Math.abs(val - targetVal) < minDiff) { minDiff = Math.abs(val - targetVal); bestIdx = i; }
            });
            return bestIdx;
        }

        function populateSelects() {
            const targetSel = document.getElementById('target-select');
            const refSel = document.getElementById('ref-select');
            
            Object.keys(tunings).forEach(key => {
                let opt = new Option(key, key);
                targetSel.add(opt.cloneNode(true));
                refSel.add(opt);
            });
            
            targetSel.add(new Option("Custom EDO...", "Custom EDO"));
            refSel.add(new Option("Custom EDO...", "Custom EDO"));
            targetSel.add(new Option("Custom JI...", "Custom JI"));
            refSel.add(new Option("Custom JI...", "Custom JI"));

            refSel.value = "12-TET";
            targetSel.value = "Just Intonation";
            updateTunings();
        }

        function getPrimeFactors(num) {
            let factors = {2:0, 3:0, 5:0, 7:0, 11:0};
            let temp = num;
            [2,3,5,7,11].forEach(p => {
                while(temp % p === 0) { factors[p]++; temp /= p; }
            });
            return factors;
        }

        function generateJIScale(limit) {
            const isWithinLimit = (num) => {
                let temp = num;
                [2,3,5,7,11].forEach(p => { if (p <= limit) while (temp % p === 0) temp /= p; });
                return temp === 1;
            };
            let scale = jiPool.filter(r => isWithinLimit(r.n) && isWithinLimit(r.d));
            return scale.map(r => ({ ...r, cents: 1200 * Math.log2(r.n/r.d) })).sort((a,b) => a.cents - b.cents);
        }

        function updateTunings() {
            const refKey = document.getElementById('ref-select').value;
            const targetKey = document.getElementById('target-select').value;

            document.getElementById('edo-group').style.display = (refKey === "Custom EDO" || targetKey === "Custom EDO") ? 'flex' : 'none';
            document.getElementById('ji-group').style.display = (refKey === "Custom JI" || targetKey === "Custom JI") ? 'flex' : 'none';

            const customN = parseFloat(document.getElementById('edo-input').value) || 31;
            const jiLimit = parseInt(document.getElementById('ji-limit').value) || 5;

            // Update Ref
            if (refKey === "Custom EDO") {
                currentRef = Array.from({length: customN + 1}, (_, i) => i * (1200/customN));
                refRatios = [];
            } else if (refKey === "Custom JI") {
                let jiScale = generateJIScale(jiLimit);
                currentRef = jiScale.map(x => x.cents);
                refRatios = jiScale;
            } else {
                currentRef = tunings[refKey];
                refRatios = [];
            }

            // Update Target
            if (targetKey === "Custom EDO") {
                currentTarget = Array.from({length: customN + 1}, (_, i) => i * (1200/customN));
                targetRatios = [];
            } else if (targetKey === "Custom JI") {
                let jiScale = generateJIScale(jiLimit);
                currentTarget = jiScale.map(x => x.cents);
                targetRatios = jiScale;
            } else {
                currentTarget = tunings[targetKey];
                targetRatios = [];
            }
            
            // 切换调律库时，也自动吸附到刚才的意图锚点，防止下标越界或错位
            selectedRefIndex = getNearestIndex(currentRef, anchorCents);
            selectedTargetIndex = getNearestIndex(currentTarget, anchorCents);
        }

        function toggleRatioFormat() {
            showDecimalRatio = !showDecimalRatio;
            document.getElementById('fmt-btn').innerText = showDecimalRatio ? 'Decimal' : 'Ratio';
        }

        // Math utilities for Original UI
        function gcd(a, b) { return !b ? a : gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }
        
        function getRationalApproximation(decimal, limit = 5000) {
            let n1 = 1, d1 = 0, n2 = 0, d2 = 1, x = decimal;
            while(true) {
                let a = Math.floor(x);
                let n = a * n1 + n2, d = a * d1 + d2;
                if (d > limit) return { n: n1, d: d1 };
                n2 = n1; d2 = d1; n1 = n; d1 = d;
                if (Math.abs(x - a) < 1e-9) return { n: n, d: d };
                x = 1 / (x - a);
            }
        }

        function getErrorColor(diff) {
            const absDiff = Math.abs(diff);
            if (absDiff < 0.01) return '#32d74b'; 
            let alpha = 0.2 + (absDiff / 24) * 0.8; 
            if (alpha > 1) alpha = 1;
            if (diff > 0) return `rgba(255, 69, 58, ${alpha})`; 
            return `rgba(10, 132, 255, ${alpha})`; 
        }
        
        function getTextColor(diff) {
            if (Math.abs(diff) < 0.01) return '#32d74b'; 
            return diff > 0 ? '#ff453a' : '#0a84ff';
        }

        function getRatioText(cents, index, targetKey) {
            if (showDecimalRatio) return Math.pow(2, cents / 1200).toFixed(4);
            if (tuningFractions[targetKey] && tuningFractions[targetKey][index]) {
                return tuningFractions[targetKey][index];
            }
            const rational = getRationalApproximation(Math.pow(2, cents / 1200), 5000);
            return `${rational.n}/${rational.d}`;
        }
        
        function getLabelName(index, totalLength) {
            if (totalLength > 13) return `${index}`; 
            return noteNames[index] || index;
        }

        function getNearestRefCents(targetCents) {
            let nearest = currentRef[0];
            let minDiff = Math.abs(targetCents - nearest);
            for(let i=1; i<currentRef.length; i++) {
                const diff = Math.abs(targetCents - currentRef[i]);
                if (diff < minDiff) { minDiff = diff; nearest = currentRef[i]; }
            }
            return nearest;
        }

        function getCoincidenceIndex(cents, index, targetKey) {
            let rational = null;
            if (tuningFractions[targetKey] && tuningFractions[targetKey][index]) {
                const parts = tuningFractions[targetKey][index].split('/');
                if (parts.length === 2) rational = { n: parseInt(parts[0]), d: parseInt(parts[1]) };
            }
            if (!rational) rational = getRationalApproximation(Math.pow(2, cents/1200), 5000);
            if (rational.n > 10000 || rational.d > 10000) return ">10k";
            return lcm(rational.n, rational.d);
        }

        function renderLoop() {
            if(!ctx) return;
            ctx.clearRect(0, 0, width, height);
            
            const rulerH = 80;
            // 完美的 50% 垂直居中
            const rulerY = (height * 0.5) - (rulerH / 2);
            
            // 1. Draw Overtone Spectrum (固定在 25% 的黄金分割线上)
            drawOvertoneSpectrum(0, (height * 0.25) - 40, width, 80);
            
            // 2. Draw Main Ruler (50% 居中区)
            drawAnalyzerRuler(0, rulerY, width, rulerH);
            
            // 3. Draw Topology Lattice (分配至下方的剩余 35% 空间)
            const targetKey = document.getElementById('target-select').value;
            const refKey = document.getElementById('ref-select').value;
            if (targetKey === "Custom JI" || refKey === "Custom JI") {
                const latticeStartY = height * 0.65;
                drawLattice(0, latticeStartY, width, height * 0.35 - 70); // -70 预留给底部 Dock
            }
            
            requestAnimationFrame(renderLoop);
        }

        function drawOvertoneSpectrum(x, y, w, h) {
            const axisY = y + h/2; 
            const scaleW = w * 0.9; 
            const padL = (w - scaleW)/2;
            const maxCents = 5000; // Extended to fit 17f harmonics (~4904 cents)
            const centsToX = (c) => padL + (c / maxCents) * scaleW;

            ctx.save();

            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, axisY); ctx.lineTo(padL + scaleW, axisY); ctx.stroke();

            const refCent = currentRef[selectedRefIndex];
            const tgtCent = currentTarget[selectedTargetIndex];
            const baseFreq = 261.63;
            const fR = baseFreq * Math.pow(2, refCent/1200);
            const fT = baseFreq * Math.pow(2, tgtCent/1200);

            let refPts = [], tgtPts = [];
            for(let n=1; n<=17; n++) {
                refPts.push({n, c: refCent + 1200 * Math.log2(n), f: fR * n});
                tgtPts.push({n, c: tgtCent + 1200 * Math.log2(n), f: fT * n});
            }

            const time = Date.now() / 1000;

            // Analyze and Draw Beating Connections
            refPts.forEach(rp => {
                tgtPts.forEach(tp => {
                    const diffCents = Math.abs(rp.c - tp.c);
                    if(diffCents < 60 && diffCents > 0.01) {
                        const beatFreq = Math.abs(rp.f - tp.f);
                        let alpha = 0.15;
                        let lw = 1;
                        
                        if (beatFreq <= 15 && beatFreq > 0.1) {
                            alpha = 0.2 + 0.6 * Math.abs(Math.sin(time * beatFreq * Math.PI));
                            lw = 1.5;
                        } else if (beatFreq <= 0.1) {
                            alpha = 0.8; lw = 1.5;
                        }

                        const px = centsToX((rp.c + tp.c)/2);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.lineWidth = lw;
                        ctx.beginPath(); 
                        ctx.moveTo(centsToX(rp.c), axisY - 10); 
                        ctx.lineTo(centsToX(tp.c), axisY + 10); 
                        ctx.stroke();

                        if (beatFreq <= 15) {
                            ctx.fillStyle = `rgba(200, 200, 200, ${Math.max(0.4, alpha)})`;
                            ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                            ctx.fillText(`${beatFreq.toFixed(1)}Hz`, px, axisY + 32);
                        }
                    }
                });
            });

            // Draw Ref Harmonics (Solid Up)
            refPts.forEach(pt => {
                const px = centsToX(pt.c);
                ctx.strokeStyle = `rgba(255,255,255, ${Math.max(0.1, 0.8 - pt.n*0.04)})`;
                ctx.beginPath(); ctx.moveTo(px, axisY); ctx.lineTo(px, axisY - 15); ctx.stroke();
                ctx.fillStyle = `rgba(255,255,255, ${Math.max(0.2, 0.9 - pt.n*0.04)})`;
                ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                ctx.fillText(`${pt.n}f`, px, axisY - 18);
            });

            // Draw Target Harmonics (Dashed Down)
            tgtPts.forEach(pt => {
                const px = centsToX(pt.c);
                ctx.strokeStyle = `rgba(180,180,180, ${Math.max(0.1, 0.8 - pt.n*0.04)})`;
                ctx.setLineDash([2,2]);
                ctx.beginPath(); ctx.moveTo(px, axisY); ctx.lineTo(px, axisY + 15); ctx.stroke();
                ctx.fillStyle = `rgba(180,180,180, ${Math.max(0.2, 0.9 - pt.n*0.04)})`;
                ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillText(`${pt.n}f`, px, axisY + 18);
            });
            
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawAnalyzerRuler(x, y, w, h) {
            ctx.save();
            const axisY = y + h/2; 
            const maxCentsTarget = Math.max(1200, ...currentTarget);
            const maxCentsRef = Math.max(1200, ...currentRef);
            const maxCents = Math.max(maxCentsTarget, maxCentsRef); 
            const scaleW = w * 0.9; 
            const padL = (w - scaleW)/2;
            const centsToX = (c) => padL + (c / maxCents) * scaleW;

            const refKey = document.getElementById('ref-select').value;
            const targetKey = document.getElementById('target-select').value;

            ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, axisY); ctx.lineTo(padL + scaleW, axisY); ctx.stroke();

            // Draw Ref Track (Up)
            currentRef.forEach((cents, i) => {
                const px = centsToX(cents);
                const isSelected = (activeTrack === 'ref' && selectedRefIndex === i);
                
                if (isSelected) {
                    ctx.fillStyle = '#fff'; ctx.fillRect(px-1.5, axisY-20, 3, 20);
                } else {
                    ctx.fillStyle = '#888'; ctx.fillRect(px-0.5, axisY-12, 1, 8);
                }

                ctx.fillStyle = isSelected ? '#fff' : '#bbb'; 
                ctx.font = isSelected ? 'bold 10px -apple-system' : '10px -apple-system'; 
                ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                
                if (currentRef.length <= 20 || i%5===0 || i===currentRef.length-1 || isSelected) {
                    ctx.fillText(getLabelName(i, currentRef.length), px, axisY - (isSelected ? 24 : 20));
                }

                if (isSelected) drawLabelUp(px, axisY - 40, cents, i, refKey);
            });

            // Draw Target Track (Down)
            currentTarget.forEach((cents, i) => {
                const px = centsToX(cents);
                let diff = cents - getNearestRefCents(cents);
                const color = getErrorColor(diff);
                const isSelected = (activeTrack === 'target' && selectedTargetIndex === i);
                
                if (isSelected) {
                    ctx.fillStyle = '#fff'; ctx.fillRect(px-1.5, axisY, 3, 20);
                } else {
                    ctx.fillStyle = color; ctx.fillRect(px-0.5, axisY, 1, 10); 
                }

                if (isSelected || currentTarget.length <= 20) {
                    const txtColor = getTextColor(diff);
                    drawLabel(px, axisY + 30, diff, cents, i, targetKey, txtColor, isSelected);
                }
            });
            ctx.restore();
        }

        // Exact restoration of user's original Label Drawing functions
        function drawLabel(x, y, diff, cents, index, targetKey, color, isHovered) {
            ctx.textAlign = 'center'; ctx.textBaseline = 'top'; 
            
            const diffLabel = (diff > 0 ? '+' : '') + diff.toFixed(1);
            const absLabel = cents.toFixed(1);
            const ratioLabel = getRatioText(cents, index, targetKey);
            const ci = getCoincidenceIndex(cents, index, targetKey);
            
            ctx.font = isHovered ? 'bold 12px -apple-system' : '500 11px -apple-system';
            ctx.fillStyle = '#fff';
            ctx.fillText(ratioLabel, x, y);
            
            ctx.font = '10px -apple-system'; 
            ctx.fillStyle = color;
            ctx.fillText(diffLabel, x, y + 14);

            ctx.fillStyle = '#ddd'; 
            ctx.fillText(absLabel, x, y + 26);
            
            ctx.fillStyle = '#999'; ctx.font = '9px -apple-system';
            ctx.fillText(`C.I. ${ci}`, x, y + 38);
        }

        function drawLabelUp(x, y, cents, index, key) {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; 
            
            const absLabel = cents.toFixed(1);
            const ratioLabel = getRatioText(cents, index, key);
            const ci = getCoincidenceIndex(cents, index, key);
            
            ctx.font = 'bold 12px -apple-system';
            ctx.fillStyle = '#fff';
            ctx.fillText(ratioLabel, x, y);
            
            ctx.font = '10px -apple-system'; 
            ctx.fillStyle = '#ddd';
            ctx.fillText(absLabel, x, y - 14);
            
            ctx.fillStyle = '#999'; ctx.font = '9px -apple-system';
            ctx.fillText(`C.I. ${ci}`, x, y - 26);
        }

        function drawLattice(x, y, w, h) {
            const ratios = activeTrack === 'ref' && document.getElementById('ref-select').value === "Custom JI" ? refRatios : 
                           (document.getElementById('target-select').value === "Custom JI" ? targetRatios : []);
            
            if (ratios.length === 0) return;

            ctx.save();
            ctx.translate(x, y);

            // Mathematics of Isometric Projection for Primes (Anchored Absolute Layout)
            const nodes = ratios.map((r, i) => {
                let fn = getPrimeFactors(r.n);
                let fd = getPrimeFactors(r.d);
                let p3 = fn[3] - fd[3];
                let p5 = fn[5] - fd[5];
                let p7 = fn[7] - fd[7];
                let p11 = fn[11] - fd[11];
                
                let nx = p3 * 1.0 + p5 * 0.5 + p7 * -0.5 + p11 * 0;
                let ny = p3 * 0.0 + p5 * -0.866 + p7 * -0.866 + p11 * -1.2;
                
                return { ...r, index: i, nx, ny, p3, p5, p7, p11 };
            });

            // Calculate exact bounding box to auto-fit the whole lattice perfectly
            let minX = Math.min(...nodes.map(n => n.nx));
            let maxX = Math.max(...nodes.map(n => n.nx));
            let minY = Math.min(...nodes.map(n => n.ny));
            let maxY = Math.max(...nodes.map(n => n.ny));

            const spanX = Math.max(maxX - minX, 1);
            const spanY = Math.max(maxY - minY, 1);
            
            const pad = 40;
            const scaleX = (w - pad * 2) / spanX;
            const scaleY = (h - pad * 2) / spanY;
            const scale = Math.min(scaleX, scaleY, 70); // Max scale limit

            const cx = w / 2;
            const cy = h / 2;
            const midX = (minX + maxX) / 2;
            const midY = (minY + maxY) / 2;

            // Draw Edges
            nodes.forEach(n1 => {
                nodes.forEach(n2 => {
                    const diff3 = Math.abs(n1.p3 - n2.p3);
                    const diff5 = Math.abs(n1.p5 - n2.p5);
                    const diff7 = Math.abs(n1.p7 - n2.p7);
                    const diff11 = Math.abs(n1.p11 - n2.p11);
                    
                    if (diff3 + diff5 + diff7 + diff11 === 1) { // 1 Prime distance
                        const px1 = cx + (n1.nx - midX) * scale;
                        const py1 = cy + (n1.ny - midY) * scale;
                        const px2 = cx + (n2.nx - midX) * scale;
                        const py2 = cy + (n2.ny - midY) * scale;
                        
                        ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
                        
                        if (diff3 === 1) { ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([]); ctx.lineWidth = 1.5; }
                        else if (diff5 === 1) { ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1; }
                        else if (diff7 === 1) { ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.setLineDash([1,3]); ctx.lineWidth = 1;}
                        else { ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.setLineDash([1,6]); ctx.lineWidth = 1; }
                        
                        ctx.stroke();
                    }
                });
            });
            ctx.setLineDash([]);

            // Draw Nodes with clear N/D text (去圆圈化，纯文字发光)
            nodes.forEach(n => {
                const px = cx + (n.nx - midX) * scale;
                const py = cy + (n.ny - midY) * scale;
                
                const isSelected = (activeTrack === 'ref' ? selectedRefIndex : selectedTargetIndex) === n.index;
                const text = `${n.n}/${n.d}`;
                
                ctx.font = isSelected ? 'bold 16px -apple-system' : '13px -apple-system';
                
                // 绘制底层微小纯黑遮罩，切断连线以保证字体纯净可读
                ctx.save();
                const txtW = ctx.measureText(text).width;
                ctx.fillStyle = '#000000';
                ctx.fillRect(px - txtW/2 - 4, py - 10, txtW + 8, 20);
                ctx.restore();

                if (isSelected) {
                    const time = Date.now() / 1000;
                    const pulse = 0.6 + 0.4 * Math.sin(time * 3);
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
                    ctx.shadowColor = `rgba(255, 255, 255, ${pulse * 0.8})`;
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = '#888';
                    ctx.shadowBlur = 0;
                }

                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, px, py);
                ctx.shadowBlur = 0; // 重置阴影避免污染其他渲染
            });

            ctx.restore();
        }

        init();
    </script>
